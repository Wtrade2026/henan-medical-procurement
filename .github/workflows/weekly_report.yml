name: 周二五周报
on:
  schedule:
    - cron: '0 5 * * 2,5'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: 创建周报 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/create_issue.py
